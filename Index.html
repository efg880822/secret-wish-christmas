
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Wish｜聖誕匿名願望籤筒</title>
  <meta name="theme-color" content="#173d35">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="subtitle">MERRY CHRISTMAS 2026</p>
    <h1>🎄 Secret Wish 🎄</h1>
    <h2>聖誕匿名願望籤筒</h2>

    <p class="description">
      寫下你的願望，等待命運抽出一份驚喜。
    </p>

    <section class="status">
      <p>目前活動狀態</p>
      <h2 id="event-status">準備中</h2>
      <p>許願截止日期：尚未設定</p>
    </section>

    <section class="actions">
      <p>準備好參加聖誕交換禮物了嗎？</p>
      <button id="wish-button">✍️ 我要許願</button>
      <button id="draw-button">🎁 我要抽籤</button>
    </section>

    <p class="footer">Made with Christmas Magic ✨</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
